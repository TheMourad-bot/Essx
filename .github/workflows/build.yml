name: Build ESSX

on:
  push:
    branches: [ main, "rebuild/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: essx-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.8.2'

      - name: Build mod
        shell: bash
        run: |
          set -o pipefail
          gradle build --no-daemon --stacktrace --console=plain 2>&1 | tee build.log

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ESSX-build-diagnostics
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ESSX-mod
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
